name: DS5111 Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (pylint)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: "test-dummy-key"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap virtual environment
        run: make update

      - name: Run lint quality gate
        run: make lint

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: "test-dummy-key"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap virtual environment
        run: make update

      - name: Run test suite
        run: make test
